name: Build CignoLauncher Executables

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: CignoLauncher-Windows
            asset_path: dist/CignoLauncher.exe
          - os: ubuntu-latest
            artifact_name: CignoLauncher-Linux
            asset_path: dist/CignoLauncher
          - os: macos-latest
            artifact_name: CignoLauncher-macOS
            asset_path: dist/CignoLauncher.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0.0"

      - name: Build Executable
        run: |
          python build.py

      - name: Package macOS Application (if macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r CignoLauncher-macOS.zip CignoLauncher.app || zip -r CignoLauncher-macOS.zip CignoLauncher

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/CignoLauncher.exe
            dist/CignoLauncher
            dist/CignoLauncher-macOS.zip
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
